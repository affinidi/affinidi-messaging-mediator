# Quickstart mediator build recipe (docker/quickstart/docker-compose.yml).
#
# The compose stack's `setup` service runs
#   mediator-setup --from /quickstart/mediator-build.toml
# once, on first start, in /etc/mediator. That generates a FRESH identity for
# this machine — mediator did:peer, admin did:key, JWT signing key — into the
# stack's `mediator-conf` volume. Nothing secret is committed: this recipe only
# says what to generate.
#
# For a real deployment run the wizard yourself (`mediator-setup`) and choose a
# proper secret backend; see the mediator README.

[deployment]
type = "container"
protocols = ["didcomm"]
use_vta = false

[identity]
# did:peer is self-resolving (the endpoint is embedded), so the stack needs no
# DID hosting.
did_method = "peer"
# The URL clients on this machine reach the mediator at (the stack publishes
# port 7037 on 127.0.0.1 only).
public_url = "http://localhost:7037"

[secrets]
# Plain file backend inside the volume (/etc/mediator/conf/secrets.json).
# Fine for a local playground; not for production. A container deployment
# refuses plaintext keys unless told otherwise, so the quickstart says so.
storage = "file://"
allow_plaintext_file = true

[security]
ssl = "none"
admin = "generate"
network_mode = "open"
cors = "none"

[database]
url = "redis://redis:6379/"

[storage]
backend = "redis"

[output]
config_path = "conf/mediator.toml"
listen_address = "0.0.0.0:7037"

[install]
enabled = false
