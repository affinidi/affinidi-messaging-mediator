name: Backport

# A merged PR labelled `backport release/<major.minor>` is cherry-picked onto
# that release branch as a new PR (RELEASES.md: fix on main first, then
# backport). Add the label before or after merging; one label per branch.
#
# A cherry-pick that conflicts still opens a PR, as a draft carrying the
# conflict, for a person to resolve — never silently dropped.
#
# Changelog notes stay on main: a patch's changelog is generated from the
# commit subjects it ships. So once the backport PRs exist, the last step
# removes from each the `changelog.d/` fragments it adds and any change (or
# conflict) it makes to CHANGELOG.md, in one signed-off commit.
#
# pull_request_target, so it runs with this repository's token even for a PR
# from a fork. It checks out no PR code to run: the action only cherry-picks
# the commits a maintainer already merged. The PR is opened with the release-bot
# app's token because one opened with GITHUB_TOKEN triggers no workflows, and
# the backport needs CI. It is required here: the enterprise does not allow
# GITHUB_TOKEN to open pull requests (RELEASES.md). The app's secrets live in
# the `release` environment, whose branch policy must admit `main`.
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

# The `closed` and `labeled` events for one PR can run at once; one run at a
# time per PR, so they never push to the same backport branch together.
concurrency:
  group: backport-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    name: Backport
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport '))
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The release-bot app (affinidi-semantic-release) is on the tags_managed
      # ruleset's bypass list and may open PRs; GITHUB_TOKEN is neither. Its
      # secrets live in the `release` environment, as in affinidi-trust-registry-rs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: korthout/backport-action@8560fb503c275d433c56f05a2f64850093baa9f7 # v4.7.0
        id: backport
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          label_pattern: '^backport (release/\d+\.\d+)$'
          pull_title: '${pull_title}'
          pull_description: |-
            Backport of #${pull_number} to `${target_branch}`.

            ${pull_description}
          add_labels: backport
          copy_assignees: true
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
      - name: Drop changelog notes from the backport PRs
        if: steps.backport.outputs.created_pull_numbers != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CREATED: ${{ steps.backport.outputs.created_pull_numbers }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          # Commit as the app that pushes, not as github-actions[bot].
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${bot}" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          for n in $CREATED; do
            [[ "$n" =~ ^[0-9]+$ ]] || { echo "::error::not a PR number: $n"; exit 1; }
            read -r head base < <(gh pr view "$n" --json headRefName,baseRefName \
              --jq '.headRefName + " " + .baseRefName')
            # Only a backport branch onto a release branch is touched.
            if ! [[ "$base" =~ ^release/[0-9]+\.[0-9]+$ && "$head" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
              echo "::error::#$n: unexpected branches '$head' -> '$base'"
              exit 1
            fi
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/$base:refs/remotes/origin/$base" \
              "+refs/heads/$head:refs/remotes/origin/$head"
            git switch -q --detach "origin/$head"
            # Fragments the backport adds (the base's own, kept from before its
            # GA, are not in this list), README excepted.
            mapfile -t added < <(git diff --name-only --diff-filter=A "origin/$base" HEAD -- \
              'changelog.d/*.md' ':(exclude)changelog.d/README.md')
            if [ "${#added[@]}" -gt 0 ]; then
              git rm -q -- "${added[@]}"
            fi
            if ! git diff --quiet "origin/$base" HEAD -- CHANGELOG.md; then
              git checkout "origin/$base" -- CHANGELOG.md
            fi
            if git diff --cached --quiet; then
              echo "#$n: no changelog notes to drop"
              continue
            fi
            git commit -q -s -m "chore(backport): drop changelog notes; a patch's notes come from commit subjects"
            git push -q origin "HEAD:refs/heads/$head"
            echo "#$n: dropped changelog notes from $head"
          done
