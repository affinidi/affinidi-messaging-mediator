name: Publish crates

# THE FILENAME OF THIS FILE IS LOAD-BEARING. crates.io Trusted Publishing is
# configured per crate against a repository + workflow FILENAME (+ the
# `release` environment below). Every crate in this workspace is registered
# against `affinidi/affinidi-messaging-mediator`, `publish.yml`, environment
# `release`. Renaming the file makes the OIDC exchange fail before anything
# publishes (verifiable-trust-infrastructure learnt this the hard way). The
# publish runs as pipeline-rust's release-publish action inside this job, so
# the trusted publisher still names this file.
#
# Publishes the workspace to crates.io from a release branch (RELEASES.md):
#
#   * only when RELEASE exists (release branches only), names a GA or patch
#     version (`X.Y.Z`; an rc publishes nothing), and equals the workspace
#     version — a mismatch fails the run rather than publishing the wrong thing;
#   * only crates whose version is not already on crates.io (read from the
#     sparse index), so a push that changes nothing — a backport before its
#     prep PR — is a no-op, and a re-run resumes where a failed one stopped;
#   * in dependency order (from `cargo metadata`), waiting for each crate to
#     reach the index before its dependents are verified.
#
# Trusted Publishing ONLY: there is no CARGO_REGISTRY_TOKEN secret and no
# fallback to one. Each crate is verify-built (`cargo package`) with no token
# in existence, then a token is minted for its upload alone (`cargo publish
# --no-verify`, seconds) and revoked: a token lives 30 minutes, and the
# mediator's verify build alone can take most of that. A failed upload is
# retried on a new token; a failed verify build stops the job.
#
# A brand-new crate cannot be published this way: a Trusted Publishing token
# can only publish to a crate that exists and lists this workflow as a trusted
# publisher. The action stops with an explanation; RELEASES.md ("A new crate")
# has the manual first-publish procedure.

on:
  push:
    branches: ["release/**"]
  # Recovery hatch: re-run the same logic (e.g. after fixing a crates.io-side
  # Trusted Publisher config). Choose the release branch as the ref.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never two publishers on one branch; never cancel one mid-release.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/heads/release/')
    # Mediator publish verification was killed (exit 143, OOM) on the default
    # runner at full parallelism in affinidi-tdk-rs, leaving 0.40.0 and its
    # dependents unpublished. Larger runner when configured, and capped rustc
    # parallelism either way.
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
    environment: release
    timeout-minutes: 240
    permissions:
      # OIDC token exchange with crates.io (Trusted Publishing).
      id-token: write
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Toolchain from rust-toolchain.toml.
      - uses: affinidi/pipeline-rust/.github/actions/release-publish@feat/release-branch-actions
        with:
          build-jobs: "4"
          # Matches CI. Deliberately without `-D warnings`: CI's publish dry-run
          # already holds the packaged builds to that, and failing a real release
          # half-way through on a lint that appeared upstream since helps nobody.
          rustflags: "--cfg tracing_unstable"
          ubuntu-rust-deps: "libdbus-1-dev libssl-dev libchafa-dev pkg-config"
