name: Coverage

# Line coverage of the default-feature workspace suite (cargo-llvm-cov), as an
# lcov artifact plus a summary on the run page. Informational only: it never
# fails on a coverage number, and it is not part of ci.yml, so it never gates
# `nightly`. Runs weekly, on demand, and after each push to main.

on:
  push:
    branches: [main]
  schedule:
    # 04:30 UTC Mondays.
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer main push supersedes an older coverage run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--cfg tracing_unstable"

jobs:
  coverage:
    name: cargo llvm-cov (workspace)
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
    timeout-minutes: 90
    # Non-blocking by design: a flaky test under instrumentation must not
    # turn anything red that a reviewer then has to explain.
    continue-on-error: true
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # The version is whatever this pinned install-action release ships.
          tool: cargo-llvm-cov
      - uses: ./.github/actions/native-deps
      - name: cargo llvm-cov
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Summary
        if: always()
        run: |
          {
            echo '## Coverage (lines, default features)'
            echo '```'
            cargo llvm-cov report --summary-only || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14
