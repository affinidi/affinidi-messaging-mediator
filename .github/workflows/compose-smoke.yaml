name: compose-smoke
# Composed-stack smoke test (TI3): builds the production mediator image
# (docker/mediator.Dockerfile), brings up docker-compose.test.yml (mediator +
# Redis + static did:web), and runs a full DIDComm round-trip against it
# (docker/smoke/smoke.sh, driving the test-mediator `docker_smoke` example).
# Then brings up the local quickstart (docker/quickstart), which generates its
# own identity, and checks it turns healthy and keeps that identity across a
# restart (docker/smoke/quickstart.sh).
#
# The image is a full release build, too heavy for every push: this runs
# nightly, on demand, and on PRs that change the image, the stacks or this
# workflow (paths below). Other PRs that touch docker/ can opt into an image
# build + boot probe with the `ci:image` label (publish-images.yaml).
#
# Runs on `vars.CI_RUNNER_LARGE` when that repo variable is set, else
# `ubuntu-24.04`.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker/**"
      - "docker-compose.test.yml"
      - ".dockerignore"
      - ".github/workflows/compose-smoke.yaml"
  schedule:
    # 04:00 UTC nightly.
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  # One run per PR, superseded by a newer push; scheduled and manual runs on a
  # branch queue rather than cancel each other.
  group: compose-smoke-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: composed-stack smoke
    runs-on: ${{ vars.CI_RUNNER_LARGE || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      RUSTFLAGS: "--cfg tracing_unstable"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-deps

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: compose-smoke

      - name: Smoke the composed stack
        # smoke.sh builds the image, brings the stack up, waits for health,
        # checks did:web, runs the SDK round-trip, then tears the stack down.
        run: bash docker/smoke/smoke.sh

      - name: Smoke the quickstart stack
        run: bash docker/smoke/quickstart.sh
