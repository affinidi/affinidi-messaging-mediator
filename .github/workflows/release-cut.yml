name: Cut a release

# Creates release/<major.minor> from `nightly` and opens the release-cut PR that
# moves main to the next minor (RELEASES.md). Run it from the Actions tab on
# main. Where cuts are moving: maintainers still cut with
# scripts/cut-release.py for now.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "major.minor, e.g. 0.49"
        required: true
        type: string
      from:
        description: "Revision to cut from"
        required: true
        type: string
        default: origin/nightly
      dry-run:
        description: "Build both commits, push nothing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Cut release/${{ inputs.name }}
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The release-bot app: a branch GITHUB_TOKEN pushes triggers no workflow,
      # so the rc.0 would never be tagged. Its secrets live in the `release`
      # environment.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Toolchain for `cargo update -w`: rust-toolchain.toml.
      - uses: affinidi/pipeline-rust/.github/actions/release-cut@feat/release-branch-actions
        with:
          name: ${{ inputs.name }}
          from: ${{ inputs.from }}
          dry-run: ${{ inputs.dry-run }}
          token: ${{ steps.app-token.outputs.token }}
