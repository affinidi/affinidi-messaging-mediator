name: publish-images

# Build and publish the mediator image from source.
#   GHCR (always)        : ghcr.io/<owner>/messaging-mediator, via GITHUB_TOKEN.
#   ECR Public (optional): mirrors the same GHCR digest; only runs when the
#                          AWS_ROLE_ARN variable is set (GitHub -> AWS OIDC).
# Multi-arch is built once on native runners and merged into one manifest list.
# The production image must build and boot-probe (verify-image) before publishing.
#
# The image is a full `cargo build --release`, so it is NOT built on every push —
# it runs only when it can pay for itself:
#   * release tag `vX.Y.Z` / `vX.Y.Z-rc.N`
#                           -> build, verify, publish, through `push: tags`.
#                              release-tag.yml creates the tag with the
#                              release-bot app's token, which (unlike a tag
#                              made with GITHUB_TOKEN) triggers that `push`
#                              run exactly as a tag pushed by a person does;
#                              nothing dispatches this workflow.
#   * workflow_dispatch     -> build, verify, publish. On a release tag it
#                              publishes only that tag's version. On `main` or
#                              `release/*` it publishes only a dev version,
#                              `v<workspace>-dev.<sha>` (the default); other
#                              branches are refused. A version already in GHCR
#                              is replaced only with `overwrite: true`
#                              (docker/ci/check-dispatch.sh, re-checked by
#                              publish-manifest.sh before the tag moves).
#   * PR labelled `ci:image`-> build + verify only (opt-in; no publish)
# Add the `ci:image` label to any PR that touches docker/ or this workflow.
#
# Image tags: always `:<version>` (e.g. `:v0.42.1`, `:v0.42.0-rc.2`). `:latest`
# moves only for a GA/patch release tag that is the highest released version —
# never for a release candidate, and never for a dispatch from a branch.
#
# The jobs that push (build, publish-ghcr, mirror-ecr-public) run in the
# `release` environment, whose deployment policy admits only main, release/*
# and v* tags (RELEASES.md).

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag to publish. On a release tag: that tag (the default). On main or release/*: only vX.Y.Z-dev.<hex sha>; the default is the workspace version plus -dev.<sha>."
        required: false
        type: string
      overwrite:
        description: "Replace the version if it already exists in GHCR."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a `ci:image` PR supersedes the image build already running
# for it. Tag and dispatch runs are never cancelled: they publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: messaging-mediator
  DOCKERFILE: docker/mediator.Dockerfile
  ECR_PUBLIC_REGISTRY: public.ecr.aws/affinidi
  ECR_PUBLIC_REGION: us-east-1

jobs:
  # Opt-in gate. Every other job hangs off this one, so an unlabelled PR skips
  # the workflow entirely (a skipped `needs` skips its dependents). Tags and
  # manual dispatch always run. The label name is inlined rather than read from
  # `env` because the `env` context is not available in a job-level `if`.
  version:
    name: resolve version
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:image')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Read-only: check-dispatch.sh looks the version up in GHCR.
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_latest: ${{ steps.v.outputs.is_latest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Self-test the version and dispatch rules
        run: bash docker/ci/test-dispatch-guard.sh

      # resolve-version.sh already keeps pre-releases (`-rc.N`) off :latest.
      # On top of that, :latest is only ever taken from a release TAG ref: a
      # dispatch from main or a release branch publishes `:<version>` only.
      - id: v
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/resolved-version"
          GITHUB_OUTPUT="$resolved" bash docker/ci/resolve-version.sh
          version=$(sed -n 's/^version=//p' "$resolved")
          is_latest=$(sed -n 's/^is_latest=//p' "$resolved")
          case "$version" in *-*) is_latest=false ;; esac
          case "$GITHUB_REF" in refs/tags/v*) ;; *) is_latest=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
          echo "Image version: $version (latest=$is_latest)"

      - name: Log in to GHCR (read)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check what a manual run may publish
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OVERWRITE: ${{ inputs.overwrite }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        run: bash docker/ci/check-dispatch.sh

  # Build the PRODUCTION image (docker/mediator.Dockerfile) on each
  # architecture we publish and prove it boots with the expected feature set.
  # This is the gate that catches a broken production image (wrong feature
  # set, unreadable config, panics on startup) before anything is published.
  #
  # Each arch caches to its own GHA scope with mode=max, and `build` below
  # builds from that same scope on the same runner type, so the publishing
  # build replays the verified layers instead of compiling again. (It cannot
  # simply push this job's image: pushing needs `packages: write`, which only
  # the `release` environment grants, and PR runs must not enter it.)
  verify-image:
    name: verify image boots (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Add swap
        # A release build of `trust-tasks-rs` peaks at several GB in one rustc,
        # and while the graph holds two copies of it (via vta-sdk and direct;
        # scripts/version-duplicates-allow.txt) they can compile at once. Thin
        # LTO lowered the link peak, but swap still lets a peak page instead of
        # the hosted runner dying as "received a shutdown signal". Memory is
        # printed so a runner that still dies says so.
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build > /dev/null
          sudo swapon /swapfile-build
          free -h

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Build image (${{ matrix.arch }}, load locally)
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:verify
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Boot probe
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:verify
        run: bash docker/ci/boot-probe.sh

  build:
    name: build ${{ matrix.platform }}
    needs: [version, verify-image]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Add swap
        # A release build of `trust-tasks-rs` peaks at several GB in one rustc,
        # and while the graph holds two copies of it (via vta-sdk and direct;
        # scripts/version-duplicates-allow.txt) they can compile at once. Thin
        # LTO lowered the link peak, but swap still lets a peak page instead of
        # the hosted runner dying as "received a shutdown signal". Memory is
        # printed so a runner that still dies says so.
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build > /dev/null
          sudo swapon /swapfile-build
          free -h

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest to GHCR
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-ghcr:
    name: publish GHCR manifest
    needs: [version, build]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    # One run at a time moves a given version's tag; a second waits.
    concurrency:
      group: publish-images-manifest-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: docker/ci
          sparse-checkout-cone-mode: false

      - name: Download digests
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create + push manifest list
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_LATEST: ${{ needs.version.outputs.is_latest }}
          EVENT_NAME: ${{ github.event_name }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: bash "$GITHUB_WORKSPACE/docker/ci/publish-manifest.sh"

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  mirror-ecr-public:
    name: mirror to ECR Public
    needs: [version, publish-ghcr]
    if: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: docker/ci
          sparse-checkout-cone-mode: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to GHCR (source)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.ECR_PUBLIC_REGION }}

      - name: Mirror manifest GHCR -> ECR Public (same digest)
        env:
          ECR_PUBLIC_REGION: ${{ env.ECR_PUBLIC_REGION }}
          SRC: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          DST: ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
          IS_LATEST: ${{ needs.version.outputs.is_latest }}
        run: bash docker/ci/mirror-ecr.sh

      - name: Attest build provenance (ECR Public, best-effort)
        # ECR Public's OCI 1.1 referrers support is weak; GHCR holds the
        # authoritative attestation, so a push failure here must not fail the job.
        continue-on-error: true
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-name: ${{ env.ECR_PUBLIC_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.publish-ghcr.outputs.digest }}
          push-to-registry: true
