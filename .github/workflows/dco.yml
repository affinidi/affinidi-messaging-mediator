name: DCO

# Every commit in a PR carries a `Signed-off-by:` trailer (the Developer
# Certificate of Origin, https://developercertificate.org). CONTRIBUTING.md
# explains `git commit -s`. Release tooling and the backport bot sign off
# their own commits (the cut and prep actions; cherry-picks keep the original
# trailer), so they pass without exceptions.
#
# Its own workflow so it re-runs in seconds on a force-push that fixes the
# sign-off, without rebuilding anything. Reads commit metadata only; checks
# out no PR code.
on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: affinidi/pipeline-rust/.github/actions/release-dco@feat/release-branch-actions
