name: Prepare a release

# Opens the PR that prepares the next rc, GA or patch of a release
# (RELEASES.md). Run it from the Actions tab with the release branch selected
# as the ref. Merging the PR it opens is the release: release-tag.yml tags it
# (and builds the image), publish.yml publishes the crates for a GA or patch.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "rc (next candidate), ga (rc.N -> .0) or patch (.N -> .N+1)"
        required: true
        type: choice
        options: [patch, rc, ga]

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.kind }} on ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The release-bot app (affinidi-semantic-release) is on the tags_managed
      # ruleset's bypass list and may open PRs; GITHUB_TOKEN is neither. Its
      # secrets live in the `release` environment, as in affinidi-trust-registry-rs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Toolchain for a patch's `cargo update -w`: rust-toolchain.toml.
      - uses: affinidi/pipeline-rust/.github/actions/release-prep@feat/release-branch-actions
        with:
          kind: ${{ inputs.kind }}
          token: ${{ steps.app-token.outputs.token }}
