name: Fuzz

# Runs the cargo-fuzz targets in fuzz/ (the TSP meta-envelope, DIDComm message
# and JWS parsers, and the inbound protocol classifier: what the mediator runs
# first on bytes from the network) for a few minutes each. Weekly and on
# demand: a time-boxed run finds shallow crashes, and these parsers change
# rarely here (most live in affinidi-tdk-rs).
#
# A crash uploads the reproducer as an artifact. Reproduce locally with
#   cargo +nightly fuzz run --fuzz-dir fuzz <target> <artifact>
#
# Not part of ci.yml, so it never gates `nightly`.

on:
  schedule:
    # 03:00 UTC Sundays.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [tsp_meta_envelope, didcomm_message_json, didcomm_jws, envelope_detect]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer needs nightly (-Zsanitizer). Invoked as `cargo +nightly`
      # because rust-toolchain.toml would otherwise select the stable pin.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # The version is whatever this pinned install-action release ships.
          tool: cargo-fuzz
      - uses: ./.github/actions/native-deps
      - name: cargo fuzz run ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        run: |
          cargo +nightly fuzz run --fuzz-dir fuzz "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
