name: Fuzz

# Runs the cargo-fuzz targets in fuzz/ for a few minutes each: the TSP
# meta-envelope, DIDComm message and JWS parsers and the inbound protocol
# classifier (what the mediator runs first on bytes from the network), the
# mediator's own MetaEnvelope classifier and config parser, and round-trip
# checks on the Redis forward-queue and pub/sub wire types. fuzz/HARNESS_MAP.md
# maps each target to the code it reaches. Weekly and on demand: a time-boxed
# run finds shallow crashes, and these surfaces change rarely.
#
# A crash uploads the reproducer as an artifact. Reproduce locally with
#   cargo +nightly fuzz run --fuzz-dir fuzz <target> <artifact>
#
# The `harnesses` job runs the loopback case-harnesses in fuzz/tests/
# (proptest against a real in-process mediator: JWT auth, ACLs, forward
# routing, trust-task freshness) on the pinned stable toolchain.
#
# Not part of ci.yml, so it never gates `nightly`.

on:
  schedule:
    # 03:00 UTC Sundays.
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds to fuzz each target"
        required: false
        default: "300"

permissions:
  contents: read

jobs:
  harnesses:
    name: loopback harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.100.0"
      - uses: ./.github/actions/native-deps
      - name: cargo test (fuzz/tests)
        run: cargo test --manifest-path fuzz/Cargo.toml --tests

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [tsp_meta_envelope, didcomm_message_json, didcomm_jws, envelope_detect, meta_envelope_new, config_parse, forward_queue_roundtrip, pubsub_record_roundtrip]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # libFuzzer needs nightly (-Zsanitizer). Invoked as `cargo +nightly`
      # because rust-toolchain.toml would otherwise select the stable pin.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          # The version is whatever this pinned install-action release ships.
          tool: cargo-fuzz
      - uses: ./.github/actions/native-deps
      - name: cargo fuzz run ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
        # --target: cargo-fuzz defaults to the triple it was built for, and
        # install-action ships a musl build, so without it every target tried to
        # build for x86_64-unknown-linux-musl (not installed, and the sanitizer
        # refuses its static libc): E0463 "can't find crate for core".
        run: |
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu --fuzz-dir fuzz "${{ matrix.target }}" -- \
            -max_total_time="$SECONDS_PER_TARGET"
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
