name: Tag a release

# A push to a release branch that moves RELEASE (the cut, or a merged prep PR)
# tags `v<RELEASE>` and opens its GitHub Release (RELEASES.md). An rc
# (`vX.Y.Z-rc.N`) is a prerelease and never "latest". Its notes are the
# version's CHANGELOG.md section where it has one, otherwise generated.
#
# The tag is created with the release-bot app's token, so it triggers
# publish-images.yaml through that workflow's own `push: tags`, exactly as a
# tag pushed by a person does: one image run per release, nothing dispatched
# from here. (A tag created with GITHUB_TOKEN would trigger nothing, which is
# why an earlier version dispatched the image build itself.)
#
# Crates are published by publish.yml on the same push (GA and patch only).
on:
  push:
    branches: ["release/**"]
    paths: [RELEASE]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<RELEASE>
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The release-bot app (affinidi-semantic-release) is on the tags_managed
      # ruleset's bypass list and may open PRs; GITHUB_TOKEN is neither. Its
      # secrets live in the `release` environment, as in affinidi-trust-registry-rs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: affinidi/pipeline-rust/.github/actions/release-tag@feat/release-branch-actions
        with:
          token: ${{ steps.app-token.outputs.token }}
