name: Tag a release

# A push to a release branch that moves RELEASE (the cut, or a merged prep PR)
# tags `v<RELEASE>` and opens its GitHub Release (RELEASES.md). An rc
# (`vX.Y.Z-rc.N`) is a prerelease and never "latest". Its notes are the
# version's CHANGELOG.md section where it has one, otherwise generated.
#
# The tag is created with the release-bot app's token, so it triggers
# publish-images.yaml through that workflow's own `push: tags`, exactly as a
# tag pushed by a person does: one image run per release, nothing dispatched
# from here. (A tag created with GITHUB_TOKEN would trigger nothing, which is
# why an earlier version dispatched the image build itself.)
#
# Crates are published by publish.yml on the same push (GA and patch only).
on:
  push:
    branches: ["release/**"]
    paths: [RELEASE]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag v<RELEASE>
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The release-bot app (affinidi-semantic-release) is on the tags_managed
      # ruleset's bypass list and may open PRs; GITHUB_TOKEN is neither. Its
      # secrets live in the `release` environment, as in affinidi-trust-registry-rs.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < RELEASE)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::RELEASE holds '$version', not major.minor.patch[-rc.N]"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::warning::$tag already exists; not moving it"
            exit 0
          fi
          # The version's own CHANGELOG section, heading excluded.
          : > "$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          fi
          args=(--target "$SHA" --title "$tag")
          case "$version" in
            *-rc.*) args+=(--prerelease --latest=false) ;;
          esac
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            args+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            args+=(--generate-notes)
          fi
          gh release create "$tag" "${args[@]}"
