name: Advisories

# A RUSTSEC advisory published against something already in Cargo.lock is
# otherwise noticed only when the next PR runs `cargo deny`. This checks the
# committed lockfile of main against the advisory database every day, so it
# shows up as its own red run instead of failing an unrelated review.
#
# Advisories only: licences, bans and sources cannot change without a commit,
# and ci.yml's `cargo deny` job checks those on every PR.

on:
  schedule:
    # 05:30 UTC daily, ahead of upstream-drift (06:00).
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories
