[package]
name = "affinidi-messaging-mediator-config"
version.workspace = true
description = "Raw TOML configuration schema for the Affinidi Messaging Mediator (shared by the mediator and its setup tool)"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[dependencies]
# Schema + config loading + validation. Still lean — no runtime/server stack.
serde = { workspace = true, features = ["derive"] }
# TOML parsing for `read_config_file`.
toml.workspace = true
# Records every key the schema does not recognise (typo'd, removed, or filed
# under the wrong `[table]`) so the mediator can warn instead of dropping it.
serde_ignored = "0.1"
# CIDR validation for trusted reverse-proxy client attribution.
ipnet = { workspace = true, features = ["serde"] }
# Lean error type for config loading (`ConfigError`).
thiserror.workspace = true
# Structured logging in the file-reading helpers, matching the mediator.
tracing.workspace = true
# Only for the lean ACL types used by validation (`types::acls`, always available
# regardless of features). `default-features = false` keeps this crate off the
# axum/redis/secrets stack. `DatabaseConfigRaw` is defined locally (see
# `schema.rs`) rather than imported from mediator-common's `database` module —
# that module is `server`-gated in the published mediator-common, so importing it
# would force this lean crate to require an unpublished mediator-common just to
# `cargo publish`. Keeping the raw DB schema here (it *is* config schema) keeps
# this crate independent of mediator-common's server tier.
affinidi-messaging-mediator-common = { version = "0.52.0", path = "../affinidi-messaging-mediator-common", default-features = false }

[dev-dependencies]
# `check_tls` test writes temp cert/key files.
tempfile.workspace = true

[lints]
workspace = true
