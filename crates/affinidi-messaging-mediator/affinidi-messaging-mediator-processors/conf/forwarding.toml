[database]
database_url = "redis://127.0.0.1/"
database_timeout = 2

### cluster_mode: "true" to talk to a cluster-mode server such as ElastiCache
### Serverless. Must match the mediator's [database] cluster_mode; startup
### refuses a server whose cluster mode differs.
### Default: "false"
cluster_mode = "false"

[processors.forwarding]
enabled = true
# These seven mirror the mediator's [processors.forwarding] settings (see its
# conf/mediator.toml); keep them the same on both.
# Seconds into the future a forward's delay may reach
future_time_limit = 86400
# Forward to remote mediators (false = local delivery only)
external_forwarding = true
# DIDs never forwarded to (blocked_forwarding_dids in the mediator)
blocked_forwarding = []
# Accept invalid TLS certificates from next hops. Never true in production.
accept_invalid_certs = false
# Hops a forward may make before it is dropped (loop protection)
max_hops = 10
# "blind" or "rewrap"; both mediators of a relaying pair must agree
relay_mode = "blind"
# Peer mediator DIDs whose relays are accepted (empty = any)
relay_trusted_mediators = []
# Sliding window in seconds for tracking message rate per endpoint
rate_window_seconds = 300
# If rate >= this threshold (msgs per 10 seconds), prefer WebSocket
ws_threshold_msgs_per_10s = 1
# Idle timeout before closing WebSocket connections (seconds)
ws_idle_timeout_seconds = 60
# Number of messages to read per batch from FORWARD_Q
batch_size = 50
# Maximum retry attempts before abandoning a message
max_retries = 5
# Initial backoff delay (ms) for retries
initial_backoff_ms = 1000
# Maximum backoff delay (ms)
max_backoff_ms = 60000
# Next-hop endpoints delivered to at once (one endpoint's messages go one at a time)
max_concurrent_endpoints = 32
# Seconds (not ms) one delivery attempt may take, WebSocket + REST fallback included
delivery_timeout_seconds = 90
# Seconds a claimed entry may sit untouched before any processor takes it over
# (keep at least twice delivery_timeout_seconds)
reclaim_idle_seconds = 180
# Redis consumer group name (all processors in same group coordinate)
consumer_group = "forwarding"
# Send problem reports to senders on forwarding failure. Must be false here:
# a report is packed with the mediator's own keys, which this standalone
# processor does not hold, so it refuses to start with true. To report
# failures to senders, forward in-process in the mediator instead.
report_errors = false
