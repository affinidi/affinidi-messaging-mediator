[package]
name = "affinidi-messaging-mediator-common"
version.workspace = true
description = "Shared types for the Affinidi Messaging Mediator (errors, database handler, config)"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[features]
# Default to the full server stack so the mediator binary, mediator-setup
# wizard, mediator-processors, and the test-mediator all compile
# unchanged. SDK-style consumers (lean DTO-only) take this crate with
# `default-features = false` and pick up `types` only — without axum,
# redis, reqwest, tokio-tungstenite, aes-gcm, argon2, metrics, etc.
default = ["server"]

# ── Server umbrella ─────────────────────────────────────────────────
## Activates every server-side module: `circuit_breaker`, `database`,
## `errors`, `secrets`, `store`, `tasks`, `time`. Pulls every
## non-types crate this package needs.
server = [
  # SystemClock logs a pre-epoch system clock, as the `time` helpers do
  "affinidi-messaging-mediator-types/tracing",
  # secrets module + envelope encryption + cache HMAC + freshness
  "dep:async-trait",
  "dep:base64",
  "dep:url",
  "dep:uuid",
  "dep:hkdf",
  "dep:hmac",
  "dep:sha2",
  "dep:hex",
  "dep:humantime",
  "dep:aes-gcm",
  "dep:argon2",
  "dep:zeroize",
  # store / database / circuit-breaker / time module support
  "dep:ahash",
  "dep:metrics",
  "dep:num-format",
  "dep:rand",
  "dep:semver",
  "dep:tokio",
  "dep:tracing",
  # axum-flavored error types (`AppError`, `IntoResponse` impls)
  "dep:axum",
  # forwarding processor (HTTP / WS to remote mediators)
  "dep:reqwest",
  "dep:tokio-tungstenite",
  "dep:futures-util",
  "dep:tokio-stream",
  # egress guard for the forwarding client (SSRF / open-relay defence)
  "dep:affinidi-net-guard",
]

# ── Storage backends ────────────────────────────────────────────────
## `RedisStore` — multi-mediator clusters and the standalone-binary
## horizontal-scaling story. Implies `server` (the trait + types live
## there) and pulls the redis client + helpers used by the impl.
redis-backend = [
  "server",
  "dep:redis",
  "dep:rustls",
  "dep:itertools",
  "dep:subtle",
]

# ── Secret backends ─────────────────────────────────────────────────
## Each backend implies `server` (so the secrets module is compiled in)
## and pulls the matching cloud SDK.
secrets-keyring = [
  "server",
  "dep:keyring-core",
  "dep:apple-native-keyring-store",
  "dep:linux-keyutils-keyring-store",
]
secrets-aws = ["server", "dep:aws-config", "dep:aws-sdk-secretsmanager"]
secrets-gcp = [
  "server",
  "dep:google-cloud-secretmanager-v1",
  "dep:google-cloud-gax",
]
secrets-azure = [
  "server",
  "dep:azure_security_keyvault_secrets",
  "dep:azure_identity",
  "dep:azure_core",
]
secrets-vault = ["server", "dep:vaultrs", "dep:rustify"]
secrets-k8s = ["server", "dep:kube", "dep:k8s-openapi"]

# ── Test-only injectable clock ──────────────────────────────────────
## Compiles `types::clock::TestClock`, a manually-advanced clock for fast
## expiry/TTL/session tests. NON-DEFAULT and never enabled by the mediator
## binary, so the advanceable clock can't reach a production build. Test
## harnesses (e.g. affinidi-messaging-test-mediator) opt in.
##
## It is also the fixture-mode marker that relaxes the forwarding egress guard
## to admit loopback + plaintext http/ws (`affinidi-net-guard/dev-loopback`), so
## the harness can forward between mediators on 127.0.0.1. Reusing the existing
## test-only feature — rather than a new one — keeps `test-mediator` (a published
## crate) resolving against the released mediator-common with no new feature
## request. Never on in a production build, so the guard stays fail-closed there.
test-clock = [
  "affinidi-messaging-mediator-types/test-clock",
  "affinidi-net-guard/dev-loopback",
]

[dependencies]
# ── Always-on ───────────────────────────────────────────────────────
## The protocol types, re-exported as `types`. They live in their own crate
## so the client SDK can depend on them without depending on this one.
affinidi-messaging-mediator-types = "0.1"
## Used by the always-built helpers (`did_web`, `parameter_store`, …) and
## the `server` modules.
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
thiserror.workspace = true
## The account a DID names (`did_identity`): a did:scid DID URL's `src`
## locator is not part of the identity. Needs 0.4.4 (the `scid` module).
affinidi-did-common.workspace = true
sha256.workspace = true

# ── Secrets module: core (gated on `server`) ────────────────────────
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true, features = ["v4"] }

# ── Secrets module: cache integrity (HMAC-SHA256 keyed via HKDF from the
## admin credential's private key) + freshness ──────────────────────────
hkdf = { version = "0.13", optional = true }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
humantime = { workspace = true, optional = true }

# ── Secrets module: file:// envelope encryption (`?encrypt=1`) ──────────
## AES-256-GCM with 12-byte nonces per write; passphrase-derived key via
## Argon2id.
aes-gcm = { version = "0.11", optional = true }
argon2 = { version = "0.6", optional = true }
zeroize = { workspace = true, optional = true, features = ["zeroize_derive"] }

# ── Secrets module: optional cloud backends ─────────────────────────
# keyring 4 split into `keyring-core` plus one crate per credential store, and
# upstream's guidance is that an application which wants to choose its stores
# should depend on those directly rather than on the `keyring` facade. We do:
# the facade's `v1` shim selects Secret Service on Linux, which needs a D-Bus
# session with an unlocked collection — something a headless mediator host does
# not have. The per-target store crates are below.
keyring-core = { version = "1", optional = true }
aws-config = { workspace = true, optional = true }

# TLS-stack feature set: see the aws-sdk-* comment in the root Cargo.toml.
aws-sdk-secretsmanager = { workspace = true, optional = true }
## GCP Secret Manager (official googleapis/google-cloud-rust crate).
## gRPC client via tonic; uses rustls (via `default-rustls-provider`)
## so it joins the workspace TLS story without pulling native-tls.
google-cloud-secretmanager-v1 = { version = "1.8", optional = true }
## Transitive dep of `google-cloud-secretmanager-v1`; reached directly
## so the GCP backend can classify errors by their rpc::Code.
google-cloud-gax = { version = "1.9", optional = true }
## Azure Key Vault Secrets (official Microsoft crate). Paired with
## `azure_identity` for the credential chain.
azure_security_keyvault_secrets = { version = "1", optional = true }
azure_identity = { version = "1", optional = true }
azure_core = { version = "1", optional = true }
## HashiCorp Vault KV v2 (rustify-based async REST client). Token auth
## via VAULT_TOKEN env. Default features bring in the rustls HTTP stack.
vaultrs = { version = "0.8", default-features = false, features = [
  "rustls",
], optional = true }
## vaultrs' HTTP layer. Named only to read the status code of a server
## response vaultrs couldn't parse as an error body (a soft-deleted KV v2
## key's 404); no features of its own.
rustify = { version = "0.7", default-features = false, optional = true }
## Native Kubernetes Secrets backend. `kube` talks to the API server
## (in-cluster ServiceAccount or local kubeconfig); rustls-tls keeps it
## on the workspace TLS story. `k8s-openapi` "latest" pins the generated
## API types to the newest supported Kubernetes version.
kube = { version = "5", default-features = false, features = [
  "client",
  "rustls-tls",
], optional = true }
k8s-openapi = { version = "0.29", features = ["latest"], optional = true }

# ── Async stream helpers (used by the redis-store pubsub bridge) ─────────
tokio-stream = { workspace = true, optional = true }

# ── Forwarding processor deps (used by `tasks::forwarding::processor`) ──
reqwest = { workspace = true, features = [
  "rustls",
  "json",
], optional = true }
# Egress guard: the forwarding client vets every next-hop endpoint (address
# class + scheme) and resolves names through a fail-closed guarded resolver, so
# an attacker-advertised service endpoint cannot pivot the mediator into an
# SSRF/open-relay against internal/metadata/loopback targets.
affinidi-net-guard = { version = "0.1.0", optional = true }
# `connect` is explicit because this is the one member that leaves
# tokio-tungstenite's default features off. In 0.29 `rustls-tls-native-roots` reached
# `connect_async` transitively; in 0.30 it maps to `__rustls-tls`, which brings
# `stream` and `handshake` but NOT `connect`. Without it the forwarding
# processor's tests fail to compile — and only when this crate is built alone,
# because a workspace build has the feature unified in from the mediator.
tokio-tungstenite = { workspace = true, features = [
  "connect",
  "rustls-tls-native-roots",
], optional = true }
futures-util = { workspace = true, features = [
  "sink",
  "std",
], optional = true }

# ── Web Framework (HTTP status codes + WebSocket types in `errors`) ─
axum = { workspace = true, optional = true, features = ["ws"] }

# ── Database (RedisStore impl, gated on `redis-backend`) ────────────
redis = { workspace = true, features = [
  "tokio-rustls-comp",
  "tls-rustls-insecure",
  "connection-manager",
  "cluster-async",
  "ahash",
], optional = true }
itertools = { workspace = true, optional = true }
## Constant-time DID-hash comparisons.
subtle = { workspace = true, optional = true }

# ── TLS (Redis TLS provider initialization) ─────────────────────────
rustls = { workspace = true, optional = true }

# ── Async Runtime (tokio::time::sleep in retry loops, etc.) ─────────
tokio = { workspace = true, features = ["time", "net"], optional = true }

# ── Utilities used across server modules ────────────────────────────
ahash = { workspace = true, optional = true, features = ["serde"] }
num-format = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
tracing = { workspace = true, optional = true, features = ["valuable"] }

# ── Metrics (CircuitBreaker gauge + counter) ────────────────────────
metrics = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
## `test-util` enables `start_paused`, used by the secrets/retry tests
## to skip the exponential-backoff delays without sleeping for real.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# ── OS keyring stores (secrets-keyring) ─────────────────────────────
# One per platform, chosen to preserve what `keyring 3` selected:
#   macOS  `apple-native`  -> Keychain
#   Linux  `linux-native`  -> kernel keyutils (NOT Secret Service; no daemon,
#                             which is what a headless mediator host needs)
# Windows is not a supported mediator host, so no store is declared for it;
# `secrets-keyring` there fails at open() with a clear message rather than
# silently using a different store.
[target.'cfg(target_os = "macos")'.dependencies]
# `keychain` (the classic file-based Keychain) rather than `protected` (the Data
# Protection Keychain, which needs an app group / entitlements a server binary
# does not have). `keychain` is what `keyring 3`'s `apple-native` used.
apple-native-keyring-store = { version = "1", features = [
  "keychain",
], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { version = "1", optional = true }

[lints]
workspace = true
