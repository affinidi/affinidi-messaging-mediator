# ============================================================================
# Mediator Build Recipe — a production mediator whose DID the VTA mints
# ============================================================================
#
# A build recipe describes a mediator setup declaratively, so it can run
# without the interactive wizard (CI/CD, reproducible deployments):
#
#   mediator-setup --from mediator-build.toml
#
# NOTE: this recipe needs a wizard built with VTA integration. This release
# builds the wizard without it (vta-sdk is out of the dependency graph until it
# is released on affinidi-messaging-sdk 0.47 / affinidi-tdk 0.45), so it is
# refused here; set `use_vta = false` and pick did:peer or did:webvh instead.
#
# This example is a sealed-mint setup: the VTA mints the mediator's DID and
# keys and hands them over in a sealed bundle, with no live network path
# between this host and the VTA. It runs in two phases:
#
#   1. mediator-setup --from mediator-build.toml
#        writes a bootstrap request file and keeps its ephemeral key in the
#        secret backend below; it prints the command the VTA admin runs.
#   2. mediator-setup --from mediator-build.toml \
#        --bundle bundle.armor --digest <sha256 the VTA admin printed>
#        opens the bundle and writes the mediator config + secrets.
#
# Any value can be overridden on the command line without editing this
# file: `--set section.key=value` (e.g. `--set security.network_mode=open`).
# Every key is listed below; everything except [deployment].type has a
# default. The full schema is in docs/setup-guide.md.
#
# This file holds no secrets. Credentials in URLs (a Redis password) are
# supplied at runtime instead:
#   DATABASE_URL="redis://:secret@host/" mediator-setup --from mediator-build.toml
# ============================================================================


# ── Deployment ──────────────────────────────────────────────────────────────
[deployment]
# type: "local" | "server" | "container"
#   local     — desktop / quick-start development
#   server    — headless production (cloud or bare-metal)
#   container — Docker image (writes Dockerfile + docker-compose.yml next to
#               the config; the config directory is mounted, never baked in)
type = "server"

# protocols: any of "didcomm", "tsp", "didcomm-v1". Default ["didcomm", "tsp"].
#   didcomm    — DIDComm v2
#   tsp        — Trust Spanning Protocol, advertised as `#tsp` in the DID.
#                Keep `didcomm` alongside it: TSP authenticates over DIDComm.
#   didcomm-v1 — Aries RFC 0019 (implies didcomm)
protocols = ["didcomm", "tsp"]

# With "didcomm-v1": accept v1 forwards without an authenticated session
# (stock Credo wallets need this). Default false.
# didcomm_v1_allow_unauthenticated_forwards = false

# use_vta: link the mediator to a VTA (Verifiable Trust Agent).
use_vta = true

# vta_mode (with use_vta = true):
#   "sealed-mint"   — the VTA mints a fresh mediator DID + keys and returns
#                     them in a sealed bundle (greenfield deployments).
#   "sealed-export" — the VTA re-exports a mediator it already provisioned
#                     (migrations, restores).
#   "online"        — live VTA session; interactive wizard only. (For an
#                     admin credential only, see --setup-key-out /
#                     --setup-key-file in the setup guide.)
vta_mode = "sealed-mint"


# ── VTA ─────────────────────────────────────────────────────────────────────
[vta]
# The VTA context this mediator lives in. Default "mediator".
context = "mediator"
# sealed-mint only: pin the minted DID's did.jsonl to a webvh server the VTA
# knows, and optionally the path on it. Omit to self-host at public_url.
# webvh_server = "prod-1"
# webvh_path = "mediator"


# ── Identity ────────────────────────────────────────────────────────────────
[identity]
# did_method: "vta" | "did:peer" | "did:webvh"
#   vta       — the VTA mints and manages the DID (needs a sealed vta_mode)
#   did:peer  — self-contained, no hosting (local development)
#   did:webvh — generated here; you host its did.jsonl. The update and
#               pre-rotation keys are stored in the secret backend
#               (mediator_webvh_update_keys) so the DID can be updated later.
did_method = "vta"

# The mediator's public URL. Required for did:webvh and for sealed-mint (the
# VTA's DID template renders the service endpoints from it).
public_url = "https://mediator.example.com"

# Also write a did:web copy of a did:webvh document (did-web.json).
# save_did_web = false

# did:webvh only: present the log as its did:scid:vh:1 DID ("scid") rather
# than its did:webvh DID ("webvh", the default).
# present_as = "webvh"
# did:webvh only: list the did:scid alias in alsoKnownAs. Default true.
# scid_also_known_as = true

# did:peer / did:webvh only: key suites minted alongside Ed25519 + X25519.
# extra_key_suites = ["p256", "secp256k1"]


# ── Secrets ─────────────────────────────────────────────────────────────────
[secrets]
# Where the mediator's keys are stored. A bare scheme takes that backend's
# defaults; a full URL sets them.
#   "keyring://affinidi-mediator"             — OS keyring (desktop)
#   "aws_secrets://us-east-1/mediator/"       — AWS Secrets Manager
#   "gcp_secrets://<project>/mediator-"       — Google Secret Manager (project required)
#   "azure_keyvault://<vault-name>"           — Azure Key Vault (vault required)
#   "vault://<host:port>/secret/mediator"     — HashiCorp Vault KV v2 (endpoint required)
#   "k8s://<namespace>/mediator-secrets"      — Kubernetes Secret
#   "file://conf/secrets.json?encrypt=1"      — local file, passphrase-encrypted
#                                               (MEDIATOR_FILE_BACKEND_PASSPHRASE)
storage = "aws_secrets://us-east-1/mediator/"

# An unencrypted file:// store outside a "local" deployment is refused
# unless explicitly accepted. Default false.
# allow_plaintext_file = false


# ── Security ────────────────────────────────────────────────────────────────
[security]
# ssl: "none" (TLS-terminating proxy) | "self-signed" (local dev) | "existing"
ssl = "none"
# Required when ssl = "existing":
# ssl_cert = "/etc/tls/cert.pem"
# ssl_key  = "/etc/tls/key.pem"

# The mediator's admin-API identity:
#   "generate" — a fresh did:key (default). In a VTA setup it is separate from
#                the VTA credential, which stays the mediator↔VTA identity;
#                its key goes to admin-monitor.json.
#   "vta"      — reuse the VTA-issued credential's DID as the admin identity.
#   "import"   — an existing DID you hold the key for (set admin_did).
#   "skip"     — no admin DID for now.
admin = "generate"
# Required when admin = "import":
# admin_did = "did:key:z6Mk..."

# jwt_mode: "generate" (default) | "provide" (MEDIATOR_JWT_SECRET at boot)
jwt_mode = "generate"

# network_mode: "open" | "closed". Default: "open" for a local deployment,
# "closed" for server and container.
#   closed — every cross-DID exchange needs an explicit ACL grant:
#              mediator_acl_mode = "explicit_allow"
#              global_acl_default = "DENY_ALL,LOCAL,SEND_MESSAGES,RECEIVE_MESSAGES"
#   open   — any DID can message any other DID; deny per DID via the ACL:
#              mediator_acl_mode = "explicit_deny"
#              global_acl_default = "ALLOW_ALL"
network_mode = "closed"

# cors: "none" (default — no cross-origin browser access) | "any" ("*") |
# "list" (only cors_domains: exact origins or *.subdomain wildcards).
cors = "none"
# Required when cors = "list":
# cors_domains = "https://app.example.com,https://*.example.com"


# ── Database ────────────────────────────────────────────────────────────────
[database]
# Redis URL (with [storage] backend = "redis"). No passwords here — use the
# DATABASE_URL environment variable.
url = "redis://127.0.0.1/"


# ── Storage ─────────────────────────────────────────────────────────────────
[storage]
# "redis" (default; multi-mediator) | "fjall" (embedded, single node)
backend = "redis"
# fjall only:
# data_dir = "./data/mediator"


# ── Output ──────────────────────────────────────────────────────────────────
[output]
# Where to write mediator.toml; did.jsonl, atm-functions.lua and the other
# generated files go next to it.
config_path = "conf/mediator.toml"
listen_address = "0.0.0.0:7037"
api_prefix = "/mediator/v1/"

# Reverse-proxy ranges whose X-Forwarded-For the rate limiter trusts. A
# catch-all range (0.0.0.0/0, ::/0) is refused.
# trust_xff_cidrs = ["10.0.0.0/8"]

# Publish the minted DID string after setup (only aws_parameter_store://
# round-trips into mediator.toml's mediator_did):
# did_target = "aws_parameter_store:///mediator/did?region=us-east-1"

# Publish the DID log (did.jsonl) after setup; mediator.toml then reads it
# from there (did_web_self_hosted), so ephemeral compute keeps serving it:
# did_log_target = "s3://my-bucket/mediator/did.jsonl?region=us-east-1"
#
# Publishing runs last: if it fails, the setup is still complete and the
# wizard exits 7 with the command to retry by hand.


# ── Install ─────────────────────────────────────────────────────────────────
[install]
# Run `cargo install` for the mediator after writing the config.
enabled = false
# Install root (`cargo install --root <path>`).
# path = "/usr/local"
