[package]
name = "affinidi-messaging-mediator-admin"
version.workspace = true
description = "Headless client for operating an Affinidi messaging mediator over Trust Tasks — mediator-wide administration or an account's own queues, plus the live traffic monitor. The engine behind the mediator console; embeddable in any application."
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[dependencies]
affinidi-messaging-sdk.workspace = true
## The account a did:scid names: its `src` locator is not part of the
## identity (`scid` module, 0.4.4).
affinidi-did-common.workspace = true
affinidi-messaging-didcomm.workspace = true
affinidi-tdk-common.workspace = true
affinidi-secrets-resolver.workspace = true
trust-tasks-rs.workspace = true
async-trait.workspace = true
chrono = { workspace = true, features = ["clock", "serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha256.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
affinidi-messaging-test-mediator = { version = "0.52.0", path = "../affinidi-messaging-test-mediator" }
affinidi-messaging-mediator-common = { version = "0.52.0", path = "../affinidi-messaging-mediator/affinidi-messaging-mediator-common" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
