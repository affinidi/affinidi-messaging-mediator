[package]
name = "affinidi-messaging-test-mediator"
version.workspace = true
description = "Embedded mediator fixture for integration tests against affinidi-messaging-mediator"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
publish = true

[features]
default = []
## Compile in `FjallStore` so tests can run the e2e suite against the
## on-disk LSM backend in addition to `MemoryStore` (which is always
## available). Adds a few hundred ms to test-binary build time and
## pulls in fjall + tempfile, so it's opt-in.
fjall-backend = ["affinidi-messaging-mediator/fjall-backend", "dep:tempfile"]
## Spawn the mediator with TSP support and expose `atm.tsp()` so the e2e suite
## can exercise the dual-protocol (DIDComm + TSP) flows.
tsp = ["affinidi-messaging-mediator/tsp", "affinidi-messaging-sdk/tsp"]
## Spawn the mediator with DIDComm v1 (Aries RFC 0019) support so the e2e suite
## can exercise forward ingress, coordinate-mediation and message pickup.
didcomm-v1 = ["affinidi-messaging-mediator/didcomm-v1", "dep:affinidi-messaging-didcomm-v1"]
## Compile in `RedisStore` so the cross-instance tests and the size sweep (`tests/e2e/`) can run
## against a real Redis named by `REDIS_URL`. Nothing else here needs Redis.
redis-backend = [
  "affinidi-messaging-mediator/redis-backend",
  "affinidi-messaging-mediator-common/redis-backend",
  "dep:redis",
]

[dependencies]
## Optional: v1 message construction for the didcomm-v1 e2e tests.
affinidi-messaging-didcomm-v1 = { workspace = true, optional = true }
# ── Mediator: the thing we're spawning ───────────────────────────────────
##
## Sister-crate path deps carry an explicit `version =` so the package
## is publishable to crates.io while still using the in-tree path for
## workspace dev-builds. Pins follow the workspace's caret-pin policy
## (major.minor only) so transitive patch fixes resolve automatically.
affinidi-messaging-mediator = { version = "0.52.0", path = "../affinidi-messaging-mediator", default-features = false, features = ["didcomm", "memory-backend"] }
# `test-clock` compiles the advanceable `TestClock` this fixture injects via
# `TestMediatorBuilder::clock` for fast expiry/TTL tests.
affinidi-messaging-mediator-common = { version = "0.52.0", path = "../affinidi-messaging-mediator/affinidi-messaging-mediator-common", features = [
  "test-clock",
] }

# ── Optional: Fjall on-disk backend support (gated on `fjall-backend`) ──
## Wraps each FjallStore in a temp directory that's cleaned up when the
## handle drops, so tests don't leak partition files on disk.
tempfile = { workspace = true, optional = true }

# ── Optional: Redis backend support (gated on `redis-backend`) ──────────
## `FLUSHDB` between size-sweep runs, so each starts from an empty keyspace.
redis = { workspace = true, optional = true, features = ["tokio-comp"] }

# ── DID + key generation ────────────────────────────────────────────────
## Used for `DID::generate_did_peer` (Ed25519 + X25519, with service URI).
affinidi-tdk = { workspace = true, features = ["did-peer"] }
affinidi-secrets-resolver.workspace = true
affinidi-did-resolver-cache-sdk.workspace = true

# ── SDK client (for the e2e test environment) ───────────────────────────
affinidi-messaging-sdk.workspace = true

# ── JWT signing key generation for the test mediator's session tokens ───
ring.workspace = true

# ── rustls: needed to install a `CryptoProvider` at fixture startup so
##     downstream test code that mixes provider features doesn't panic
##     on the first WS handshake. Tracks the mediator's pinned version
##     so the provider type matches across the workspace.
rustls.workspace = true

# ── Async + lifecycle ───────────────────────────────────────────────────
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-util.workspace = true
async-trait.workspace = true

# ── Errors + utility ────────────────────────────────────────────────────
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4", "fast-rng"] }
## Used to hash DIDs into their canonical account-store key shape when
## pre-registering local DIDs at startup.
sha256.workspace = true
## `serde_json` + the DIDComm `Message` builder back the `TestTopology`
## forwarding helper, which constructs the routing-2.0 double forward in
## library code (the SDK doesn't re-export `Message`).
serde_json.workspace = true
affinidi-messaging-didcomm.workspace = true

[dev-dependencies]
## The mediator's test-only pause points (`test-hooks`), for the race-window
## tests. A dev-dependency, so the fixture library itself never carries them.
affinidi-messaging-mediator = { version = "0.52.0", path = "../affinidi-messaging-mediator", default-features = false, features = ["didcomm", "memory-backend", "test-hooks"] }
## `issuedAt` on the hand-built Trust Task documents in tests/e2e/trust_tasks.rs.
chrono = { workspace = true, features = ["clock"] }
## Drive the SDK's DIDComm transport as the delivery layer does.
affinidi-messaging-core.workspace = true
## Build hand-written authcrypt envelopes for the sender-binding tests.
affinidi-crypto = { workspace = true, features = ["jose"] }
affinidi-did-common.workspace = true
## Used by integration tests to hit the mediator's HTTP endpoints
## without going through the SDK.
reqwest = { workspace = true, features = ["default", "rustls", "json"] }
## TSP control-message types named by the TSP control-relay integration test.
affinidi-tsp.workspace = true
## Re-encode raw qb2 bytes from a flushed TSP websocket Binary frame back to
## the stored base64url form so the SDK can unpack it (tsp_websocket test).
base64.workspace = true
## Trust Tasks payload types named by the Trust Tasks integration tests.
trust-tasks-rs.workspace = true
## Verifies the mediator's signed Trust Task responses.
trust-tasks-proof = { workspace = true, features = ["affinidi"] }
affinidi-data-integrity.workspace = true
## Tracing subscriber for test diagnostics.
tracing-subscriber = { workspace = true, features = ["default", "env-filter", "fmt"] }
## WebSocket handshake test.
tokio-tungstenite = { workspace = true, features = ["default", "rustls-tls-native-roots"] }
## `StreamExt::next` to read frames from a `tokio-tungstenite` WebSocket
## stream (per-DID connection-cap test reads the server's Close frame).
futures-util = { workspace = true, features = ["default"] }
## `io-util` for the raw-socket WebSocket handshake test (the bearer-only
## browser scenario can't go through tokio-tungstenite's client, which
## errors when it offers a subprotocol the server doesn't echo back).
tokio = { workspace = true, features = ["io-util"] }
## The stub remote mediator in `tests/e2e/forwarding_processor.rs`.
axum.workspace = true
## The didcomm-service tests that run it against a live mediator
## (`soft_restart_websocket`, `tsp_*`). They lived in that crate's own tests
## until the mediator moved out of affinidi-tdk-rs; a dev-dependency there on
## this crate would make a cross-repository cycle, so they run here instead.
affinidi-messaging-didcomm-service = { version = "0.32.0", features = ["tsp"] }
## `affinidi_tdk::messaging::ATM` for the TSP transport-adapter test.
affinidi-tdk = { workspace = true, features = ["did-peer", "messaging"] }
affinidi-tdk-common.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--cfg", "tracing_unstable"]
rustc-args = ["--cfg", "tracing_unstable"]
