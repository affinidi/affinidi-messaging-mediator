[package]
name = "affinidi-messaging-mediator-tui"
version.workspace = true
description = "Terminal console for an Affinidi messaging mediator: statistics, queues with gradient quota bars, messages, purges and a live traffic monitor — as embeddable ratatui components and the `mediator-console` binary."
edition.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "mediator-console"
path = "src/bin/mediator-console/main.rs"

[dependencies]
affinidi-messaging-mediator-admin = { version = "0.52.0", path = "../affinidi-messaging-mediator-admin" }
ratatui.workspace = true
# Crossterm must match the version ratatui uses.
crossterm = { workspace = true, features = ["event-stream"] }
futures-util = { workspace = true, features = ["default"] }
serde = { workspace = true, features = ["derive"] }
sha256.workspace = true
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
clap = { workspace = true, features = ["derive"] }
tracing.workspace = true
# The `mediator-console` binary's log output, captured into the console.
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi"] }

[dev-dependencies]
affinidi-messaging-test-mediator = { version = "0.52.0", path = "../affinidi-messaging-test-mediator" }
affinidi-messaging-mediator-common = { version = "0.52.0", path = "../affinidi-messaging-mediator/affinidi-messaging-mediator-common" }
affinidi-messaging-didcomm.workspace = true
uuid = { workspace = true, features = ["v4"] }
## Signs the mux grants the Grants tab lists.
affinidi-messaging-sdk.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs", "--cfg", "tracing_unstable"]
rustc-args = ["--cfg", "tracing_unstable"]
